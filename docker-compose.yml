services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}
    container_name: finanzia-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=3000
    ports:
      - "3010:3000"
    networks:
      - shared-postgres-net

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: finanzia-frontend
    restart: unless-stopped
    ports:
      - "8090:80"

networks:
  shared-postgres-net:
    external: true
